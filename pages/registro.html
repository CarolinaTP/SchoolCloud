  <meta name="author" content="SchoolCloud Team">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../style/styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-azul shadow-sm">
  <div class="container">
    
    <a class="navbar-brand d-flex align-items-center" href="../index.html">
      <img src="../img/logo.png" class="logo-img me-2" alt="Logo SchoolCloud">
      <span class="fw-bold">SchoolCloud</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="menu" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="./propuestas.html">Propuestas</a></li>
        <li class="nav-item"><a class="nav-link" href="./noticias.html">Noticias</a></li>
        <li class="nav-item"><a class="nav-link" href="./contactos.html">Contactos</a></li>

        <li class="nav-item ms-lg-3">
          <a href="./login.html" class="nav-link p-0">
            <img src="../img/login.png" class="user-icon" alt="Login">
          </a>
        </li>

      </ul>
    </div>

  </div>
</nav>


<!-- CONTENEDOR DEL FORMULARIO -->
<main class="login-container fade-in">

  <form class="login-box shadow">

    <h2 class="text-center mb-4 fw-bold">Crear Cuenta</h2>

    <!-- DOCUMENTO DE IDENTIDAD -->
    <div class="mb-3">
      <label for="documento" class="form-label visually-hidden">Documento de identidad</label>
      <input type="number" id="documento" name="documento" class="form-control" placeholder="Documento de identidad" required>
    </div>

    <!-- NOMBRE COMPLETO -->
    <div class="mb-3">
      <label for="nombre" class="form-label visually-hidden">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Nombre completo" required autocomplete="name">
    </div>

    <!-- FECHA DE NACIMIENTO -->
    <div class="mb-3">
      <label for="fechaNacimiento" class="form-label mb-1 ms-1">Fecha de nacimiento</label>
      <input type="date" id="fechaNacimiento" name="fecha_nacimiento" class="form-control" required>
    </div>

    <!-- CORREO ELECTRÓNICO -->
    <div class="mb-3">
      <label for="email" class="form-label visually-hidden">Correo electrónico</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="Correo electrónico" required autocomplete="email">
    </div>

    <!-- CONTRASEÑA -->
    <div class="mb-4">
      <label for="password" class="form-label visually-hidden">Crear contraseña</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Crear contraseña" required autocomplete="new-password">
    </div>

    <!-- BOTÓN -->
    <button type="submit" class="btn btn-azul w-100">Registrarse</button>

    <p class="text-center mt-3">
      ¿Ya tienes cuenta?
      <a href="./login.html" class="link-azul">Inicia sesión</a>
    </p>

  </form>

</main>

<!-- FOOTER -->
<footer class="footer text-center">
    <p>© 2025 SchoolCloud</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
